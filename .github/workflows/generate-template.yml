name: Schulwochen-Vorlage generieren

on:
  workflow_dispatch:
    inputs:
      schuljahr:
        description: 'Schuljahr (z.B. 2026/27)'
        required: true
        default: '2026/27'
      sw00:
        description: 'Erster Schultag (SW 00) - Format: JJJJ-MM-TT'
        required: true
        default: '2026-08-24'
      sw01:
        description: 'Erster Unterrichtstag (SW 01) - Format: JJJJ-MM-TT'
        required: true
        default: '2026-08-31'
      last_day:
        description: 'Letzter Schultag - Format: JJJJ-MM-TT'
        required: true
        default: '2027-07-16'
      herbst_von:
        description: 'Herbstferien von - Format: JJJJ-MM-TT'
        required: true
        default: '2026-10-19'
      herbst_bis:
        description: 'Herbstferien bis - Format: JJJJ-MM-TT'
        required: true
        default: '2026-10-30'
      weihnachten_von:
        description: 'Weihnachtsferien von - Format: JJJJ-MM-TT'
        required: true
        default: '2026-12-22'
      weihnachten_bis:
        description: 'Weihnachtsferien bis - Format: JJJJ-MM-TT'
        required: true
        default: '2027-01-03'
      ostern_von:
        description: 'Osterferien von - Format: JJJJ-MM-TT'
        required: true
        default: '2027-03-22'
      ostern_bis:
        description: 'Osterferien bis - Format: JJJJ-MM-TT'
        required: true
        default: '2027-04-02'
      pfingsten_von:
        description: 'Pfingstferien von (optional) - Format: JJJJ-MM-TT'
        required: false
        default: ''
      pfingsten_bis:
        description: 'Pfingstferien bis (optional) - Format: JJJJ-MM-TT'
        required: false
        default: ''
      sommer_von:
        description: 'Sommerferien von - Format: JJJJ-MM-TT'
        required: true
        default: '2027-07-19'
      sommer_bis:
        description: 'Sommerferien bis - Format: JJJJ-MM-TT'
        required: true
        default: '2027-08-31'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: pip install openpyxl

      - name: Konfigurationsdatei erstellen
        run: |
          python3 << 'PYEOF'
          import json
          import os

          def get_input(name):
              return os.environ.get(f"INPUT_{name}", "")

          def make_date(val):
              return val if val else None

          cfg = {
              "schuljahr": get_input("schuljahr"),
              "sw00": get_input("sw00"),
              "sw01": get_input("sw01"),
              "last_day": get_input("last_day"),
              "holidays": [
                  {"name": "Herbstferien", "start": get_input("herbst_von"), "end": get_input("herbst_bis")},
                  {"name": "Weihnachtsferien", "start": get_input("weihnachten_von"), "end": get_input("weihnachten_bis")},
                  {"name": "Osterferien", "start": get_input("ostern_von"), "end": get_input("ostern_bis")},
                  {"name": "Pfingstferien", "start": make_date(get_input("pfingsten_von")), "end": make_date(get_input("pfingsten_bis"))},
                  {"name": "Sommerferien", "start": get_input("sommer_von"), "end": get_input("sommer_bis")}
              ]
          }

          with open("ferien_config.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2, ensure_ascii=False)

          print("Konfiguration:")
          print(json.dumps(cfg, indent=2, ensure_ascii=False))
          PYEOF
        env:
          INPUT_schuljahr: ${{ github.event.inputs.schuljahr }}
          INPUT_sw00: ${{ github.event.inputs.sw00 }}
          INPUT_sw01: ${{ github.event.inputs.sw01 }}
          INPUT_last_day: ${{ github.event.inputs.last_day }}
          INPUT_herbst_von: ${{ github.event.inputs.herbst_von }}
          INPUT_herbst_bis: ${{ github.event.inputs.herbst_bis }}
          INPUT_weihnachten_von: ${{ github.event.inputs.weihnachten_von }}
          INPUT_weihnachten_bis: ${{ github.event.inputs.weihnachten_bis }}
          INPUT_ostern_von: ${{ github.event.inputs.ostern_von }}
          INPUT_ostern_bis: ${{ github.event.inputs.ostern_bis }}
          INPUT_pfingsten_von: ${{ github.event.inputs.pfingsten_von }}
          INPUT_pfingsten_bis: ${{ github.event.inputs.pfingsten_bis }}
          INPUT_sommer_von: ${{ github.event.inputs.sommer_von }}
          INPUT_sommer_bis: ${{ github.event.inputs.sommer_bis }}

      - name: Vorlage generieren
        run: |
          python scripts/generate_school_template.py --config ferien_config.json

      - name: Als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Schulwochen-Vorlage-${{ github.event.inputs.schuljahr }}
          path: Terminplan_Schulwochen_Vorlage_*.xlsx

      - name: Datei zur Release-Seite hinzufuegen (falls Release existiert)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: Terminplan_Schulwochen_Vorlage_*.xlsx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
